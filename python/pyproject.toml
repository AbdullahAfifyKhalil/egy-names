[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egy-names"
version = "0.3.5"
description = "A production-grade Egyptian onomastic intelligence library — generate, translate, annotate, split, and analyze Egyptian names."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdullah Afify", email = "abdullah@afify.dev" }]
maintainers = [{ name = "Afify" }]
keywords = ["arabic", "egypt", "egyptian", "name-generator", "name-translation", "names", "nlp", "onomastics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/afify/egy-names"
Documentation = "https://github.com/afify/egy-names#readme"
Issues = "https://github.com/afify/egy-names/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/egy_names"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
]
