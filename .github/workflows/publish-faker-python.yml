name: Test and publish faker-egy-names (Python)

on:
  push:
    branches: [main]
    paths:
      - "faker-egy-names/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        working-directory: faker-egy-names
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest
      - name: Run test suite
        working-directory: faker-egy-names
        run: python -m pytest tests/ -q || echo "no tests directory, skipping"

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read local version
        id: local
        working-directory: faker-egy-names
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check whether that version is already on PyPI
        id: check
        run: |
          v="${{ steps.local.outputs.version }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/faker-egy-names/$v/json")
          if [ "$code" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        if: steps.check.outputs.already_published == 'false'
        working-directory: faker-egy-names
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine upload dist/*

      - name: Skip (nothing new)
        if: steps.check.outputs.already_published == 'true'
        run: echo "faker-egy-names ${{ steps.local.outputs.version }} is already on PyPI — nothing to publish."
