name: Test and publish Python package

# Single source of truth for the version bump: bump the number in
# python/pyproject.toml yourself and push to main. This workflow runs
# the full test suite, and only if it passes AND the version in
# pyproject.toml is not already on PyPI, builds and publishes it.
# Nothing publishes on commits that do not touch the version — safe to
# push docs/fixes without triggering a release.

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "data/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest
      - name: Run test suite
        working-directory: python
        run: python -m pytest tests/ -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for PyPI trusted publishing, if configured instead of a token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read local version
        id: local
        working-directory: python
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check whether that version is already on PyPI
        id: check
        run: |
          v="${{ steps.local.outputs.version }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/egy-names/$v/json")
          if [ "$code" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        if: steps.check.outputs.already_published == 'false'
        working-directory: python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine upload dist/*

      - name: Skip (nothing new)
        if: steps.check.outputs.already_published == 'true'
        run: echo "egy-names ${{ steps.local.outputs.version }} is already on PyPI — nothing to publish."
