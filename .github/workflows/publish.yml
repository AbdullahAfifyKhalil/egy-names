name: Publish Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Publish Python package to PyPI
  # ────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Package
        working-directory: './python'
        run: |
          python -m build

      - name: Publish to PyPI
        working-directory: './python'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

  # ────────────────────────────────────────────────────────────
  # 2. Publish TypeScript package to npm
  # ────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install & Build
        working-directory: './typescript'
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        working-directory: './typescript'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

  # ────────────────────────────────────────────────────────────
  # 3. Publish .NET package to NuGet
  # ────────────────────────────────────────────────────────────
  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Pack
        working-directory: './csharp/EgyNames'
        run: |
          dotnet pack -c Release -o out

      - name: Push to NuGet
        working-directory: './csharp/EgyNames'
        run: |
          dotnet nuget push out/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
