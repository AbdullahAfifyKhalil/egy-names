<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#070a11"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Emerald Teal Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="3"/>

  <!-- Glowing Accent Backlight -->
  <circle cx="256" cy="240" r="140" fill="rgba(16, 185, 129, 0.12)" filter="url(#glow)"/>

  <!-- Pyramid Geometric Apex -->
  <g transform="translate(0, 10)">
    <!-- Pyramid Left Light Face -->
    <polygon points="256,105 150,305 256,285" fill="url(#goldLight)"/>
    
    <!-- Pyramid Right Shaded Face -->
    <polygon points="256,105 256,285 362,305" fill="url(#goldDark)"/>
    
    <!-- Pyramid Base Highlight Line -->
    <polyline points="150,305 256,285 362,305" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

    <!-- Calligraphic Name Ribbon / Flowing Arabic Ain (ع) Loop in Emerald & Gold -->
    <!-- Lower Loop Base -->
    <path d="M 160,290 C 140,350 200,395 280,395 C 365,395 405,335 385,275 C 375,245 340,230 310,235 C 275,240 250,270 235,310 C 215,360 170,360 160,290 Z" fill="url(#emeraldGrad)" opacity="0.95"/>
    
    <!-- Flowing Gold Ribbon Trim -->
    <path d="M 168,285 C 190,345 250,380 320,365 C 370,350 395,305 380,265 C 365,225 315,220 280,250 C 245,280 230,335 210,355" fill="none" stroke="url(#goldLight)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Apex Diacritic / Tashkeel Diamond Star -->
    <g transform="translate(256, 85) rotate(45)">
      <rect x="-9" y="-9" width="18" height="18" fill="#FDE68A" rx="3"/>
    </g>
  </g>
</svg>
